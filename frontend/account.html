<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account - Foot Mart</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">

    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #e53935;
            --bg: #f8f9fa;
            --card: #ffffff;
            --border: #e0e0e0;
            --shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: #333;
            padding-top: 70px;
            /* navbar space */
            padding-bottom: 60px;
            /* bottom nav space */
            overflow-x: hidden;
        }

        /* ================= NAVBAR ================= */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: #fff;
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        nav h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            /* Extra Bold */
            color: var(--primary);
        }

        /* ================= ACCOUNT PAGE ================= */
        .account-container {
            width: 100%;
            max-width: 1000px;
            /* Increased from 800px */
            margin: 3rem auto;
            /* More breathing room */
            padding: 0 2rem;
        }

        .account-header-card {
            background: var(--card);
            border-radius: 20px;
            /* More rounded */
            padding: 2rem;
            display: flex;
            flex-direction: column;
            /* Stacked vertically like image */
            align-items: center;
            text-align: center;
            gap: 1rem;
            box-shadow: none;
            /* Image looks flat or very subtle */
            margin-bottom: 2rem;
        }

        .account-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-bottom: 10px;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .account-info h2 {
            margin: 0;
            font-size: 1.8rem;
            /* Big name */
            font-weight: 700;
        }

        .account-info p {
            margin: 5px 0 0;
            color: #666;
            font-size: 1rem;
        }

        .login-btn-large {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: var(--primary);
            color: #fff;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.95rem;
        }

        /* ================= ACTIONS ================= */
        .account-actions {
            background: transparent;
            box-shadow: none;
            border-radius: 0;
            overflow: visible;
            display: grid;
            grid-template-columns: 1fr;
            /* Force single column */
            gap: 20px;
        }

        .action-btn {
            width: 100%;
            background: var(--card);
            border: none;
            border-radius: 16px;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            background-color: #fff;
        }

        /* Remove the old border logic */
        .action-btn:last-child {
            border-bottom: none;
        }

        .action-icon {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
            /* Bolder text */
            font-size: 1.1rem;
            color: #333;
        }

        /* Use emojis font size */
        .action-icon span {
            font-size: 24px;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;

            /* Distribute space evenly */
        }

        .bottom-nav-item span {
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 13px;
            /* Slightly larger */
            color: #444;
            /* Default dark grey */
        }

        .bottom-nav-item.active span {
            font-weight: 700;
            color: #000;
        }

        .bottom-nav-item svg {
            width: 24px;
            height: 24px;
            stroke: #444;
            /* Dark grey stroke */
            stroke-width: 2;
            fill: none;
        }

        .bottom-nav-item.active svg {
            stroke: #000;
            stroke-width: 2.5;
            /* Bolder icon when active */
        }

        .logout-action {
            color: var(--accent);
            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        /* ================= BOTTOM NAV ================= */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #fff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.06);
        }

        .bottom-nav-item {
            text-decoration: none;
            color: #444;
            font-size: 12px;
            text-align: center;
        }

        .bottom-nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <a href="index.html" style="text-decoration: none;">
            <h1>Foot Mart</h1>
        </a>
    </nav>

    <!-- ACCOUNT -->
    <div class="account-container">

        <!-- LOGGED IN -->
        <div id="account-logged-in" class="hidden">
            <div class="account-header-card">
                <div class="account-avatar">👤</div>
                <div class="account-info">
                    <h2 id="page-profile-name">User</h2>
                    <p id="page-profile-email">email@example.com</p>
                </div>
            </div>

            <div class="account-actions">
                <button class="action-btn" onclick="window.location.href='wishlist.html'">
                    <div class="action-icon">
                        <span>❤️</span> My Wishlist
                    </div>
                    <span>›</span>
                </button>

                <button class="action-btn" onclick="showChangePassword()">
                    <div class="action-icon">
                        <span>🔒</span> Change Password
                    </div>
                    <span>›</span>
                </button>

                <button class="action-btn" onclick="showHelpModal()">
                    <div class="action-icon">
                        <span>❓</span> Help & Support
                    </div>
                    <span>›</span>
                </button>

                <button class="action-btn logout-action" id="page-logout-btn">
                    <div class="action-icon">
                        <span>🚪</span> Logout
                    </div>
                </button>
            </div>
        </div>

        <!-- CHANGE PASSWORD SECTION -->
        <div id="account-change-password" class="hidden">
            <div class="account-header-card">
                <h2>Change Password</h2>
                <p>Update your password to keep your account secure.</p>

                <div style="width: 100%; max-width: 400px; text-align: left; margin-top: 20px;">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="cpemail" style="display: block; margin-bottom: 5px; font-weight: 500;">Email</label>
                        <input type="email" id="cpemail" placeholder="Confirm your email"
                            style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"
                            readonly>
                    </div>

                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="oldpassword" style="display: block; margin-bottom: 5px; font-weight: 500;">Current
                            Password</label>
                        <input type="password" id="oldpassword" placeholder="Enter current password"
                            style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="newpassword" style="display: block; margin-bottom: 5px; font-weight: 500;">New
                            Password</label>
                        <input type="password" id="newpassword" placeholder="Enter new password"
                            style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;">
                    </div>

                    <p id="change-pass-error"
                        style="color: red; display: none; margin-bottom: 15px; font-size: 0.9rem;"></p>

                    <button onclick="changePassword()"
                        style="width: 100%; padding: 14px; background: #1a1a1a; color: white; border: none; border-radius: 30px; font-weight: 600; cursor: pointer;">Update
                        Password</button>

                    <button onclick="hideChangePassword()"
                        style="width: 100%; padding: 14px; background: transparent; color: #666; border: none; margin-top: 10px; cursor: pointer;">Cancel</button>
                </div>
            </div>
        </div>

        <!-- LOGGED OUT -->
        <div id="account-logged-out">
            <div class="account-header-card">
                <div class="account-avatar">?</div>
                <div class="account-info">
                    <h2>Welcome Guest</h2>
                    <p>Login to manage your profile.</p>
                    <a href="login.html" class="login-btn-large">Login / Register</a>
                </div>
            </div>
        </div>

    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
        </a>
        <a href="cart.html" class="bottom-nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span>Cart</span>
        </a>
        <a href="account.html" class="bottom-nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Account</span>
        </a>
    </div>

    <script src="operation.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = localStorage.getItem("user");
            const inView = document.getElementById("account-logged-in");
            const outView = document.getElementById("account-logged-out");

            if (user) {
                const u = JSON.parse(user);
                document.getElementById("page-profile-name").textContent = u.name || "User";
                document.getElementById("page-profile-email").textContent = u.email || "";
                inView.classList.remove("hidden");
                outView.classList.add("hidden");
            } else {
                inView.classList.add("hidden");
                outView.classList.remove("hidden");
            }

            const logoutBtn = document.getElementById("page-logout-btn");
            if (logoutBtn && typeof logout === "function") {
                logoutBtn.onclick = logout;
            }
        });

        function showChangePassword() {
            const userJson = localStorage.getItem("user");
            if (userJson) {
                const user = JSON.parse(userJson);
                const emailField = document.getElementById("cpemail");
                if (emailField) emailField.value = user.email || "";
            }

            document.getElementById("account-logged-in").classList.add("hidden");
            document.getElementById("account-change-password").classList.remove("hidden");
        }

        function hideChangePassword() {
            document.getElementById("account-change-password").classList.add("hidden");
            document.getElementById("account-logged-in").classList.remove("hidden");

            // Clear fields (optional)
            document.getElementById("oldpassword").value = "";
            document.getElementById("newpassword").value = "";
            document.getElementById("change-pass-error").style.display = "none";
        }
    </script>

</body>

</html>
